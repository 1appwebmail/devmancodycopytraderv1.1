<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Devmancody-CopytraderBot</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --green: #3fb950;
    --red: #f85149;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; color: var(--accent); }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat .label { color: var(--muted); font-size: 11px; text-transform: uppercase; }
  .stat .value { font-size: 15px; font-weight: 600; }
  .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  .badge.connected { background: #1a3a1a; color: var(--green); }
  .badge.disconnected, .badge.error { background: #3a1a1a; color: var(--red); }
  main { display: flex; flex-direction: column; gap: 16px; padding: 0 20px 16px; }
  .side-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 800px) { .side-grid { grid-template-columns: 1fr; } }
  .filters {
    display: flex;
    align-items: flex-end;
    gap: 16px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-wrap: wrap;
  }
  .filter-field { display: flex; flex-direction: column; gap: 3px; }
  .filter-field label { color: var(--muted); font-size: 10px; text-transform: uppercase; }
  .filter-field input {
    width: 100px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: 5px 7px;
    font-family: inherit;
    font-size: 12px;
  }
  .filter-field input:focus { outline: 1px solid var(--accent); }
  button.save-btn {
    background: #123a24;
    color: var(--green);
    border: 1px solid #1e5c38;
    border-radius: 4px;
    padding: 6px 14px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    height: 28px;
  }
  button.save-btn:hover { background: #164a2e; }
  #filtersStatus { font-size: 11px; color: var(--muted); align-self: center; }
  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .table-scroll { overflow-x: auto; }
  section h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 0;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; }
  tr:last-child td { border-bottom: none; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .mint-link { color: var(--accent); text-decoration: none; }
  .mint-link:hover { text-decoration: underline; }
  .mint-cell { display: flex; align-items: center; gap: 6px; }
  button.copy-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 12px;
    padding: 2px 4px;
    border-radius: 4px;
    line-height: 1;
  }
  button.copy-btn:hover { background: var(--border); }
  button.close-btn {
    background: #3a1a1a;
    color: var(--red);
    border: 1px solid #5a2a2a;
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
  }
  button.close-btn:hover { background: #4a2020; }
  button.close-btn:disabled { opacity: 0.5; cursor: default; }
  button.hold-btn {
    background: var(--panel);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
  }
  button.hold-btn:hover { border-color: #c9a227; color: #e0b93a; }
  button.hold-btn.active {
    background: #3a2f0f;
    color: #e0b93a;
    border: 1px solid #7a5f1a;
  }
  button.hold-btn:disabled { opacity: 0.5; cursor: default; }
  .held-badge {
    font-size: 10px;
    color: #e0b93a;
    background: #3a2f0f;
    border: 1px solid #7a5f1a;
    border-radius: 8px;
    padding: 1px 6px;
    white-space: nowrap;
  }
  tr.held-row { background: rgba(224, 185, 58, 0.05); }
  #feed { max-height: 70vh; overflow-y: auto; padding: 8px 0; }
  .feed-item { padding: 6px 14px; border-bottom: 1px solid var(--border); font-size: 12px; line-height: 1.5; }
  .feed-item:last-child { border-bottom: none; }
  .feed-item .time { color: var(--muted); margin-right: 8px; }
  .feed-item.buy { color: var(--green); }
  .feed-item.sell { color: var(--red); }
  .feed-item.status { color: var(--muted); }
  .empty { padding: 20px 14px; color: var(--muted); text-align: center; }
  #copyLog { max-height: 70vh; overflow-y: auto; }
  .copy-entry { padding: 8px 14px; border-bottom: 1px solid var(--border); font-size: 12px; line-height: 1.6; }
  .copy-entry:last-child { border-bottom: none; }
  .copy-entry .time { color: var(--muted); font-size: 11px; }
  .copy-entry .row { display: flex; justify-content: space-between; gap: 8px; }
  .copy-entry .label { color: var(--muted); }
  .copy-entry .delta.pos { color: var(--green); }
  .copy-entry .delta.neg { color: var(--red); }
</style>
</head>
<body>

<header>
  <h1 id="botName">Devmancody-CopytraderBot</h1>
  <div class="stat"><span class="label">Mode</span><span class="value" id="mode">—</span></div>
  <div class="stat"><span class="label">Balance</span><span class="value" id="balance">—</span></div>
  <div class="stat"><span class="label">Open Positions</span><span class="value" id="openCount">—</span></div>
  <div class="stat"><span class="label">Realized PnL</span><span class="value" id="pnl">—</span></div>
  <div class="stat"><span class="label">Feed</span><span class="value"><span class="badge disconnected" id="wsStatus">connecting…</span></span></div>
</header>

<div class="filters">
  <div class="filter-field">
    <label for="minMcap">Min Mcap (USD)</label>
    <input type="number" id="minMcap" step="any" placeholder="none" />
  </div>
  <div class="filter-field">
    <label for="maxMcap">Max Mcap (USD)</label>
    <input type="number" id="maxMcap" step="any" placeholder="none" />
  </div>
  <div class="filter-field">
    <label for="minAge">Min Age (s)</label>
    <input type="number" id="minAge" step="any" placeholder="none" />
  </div>
  <div class="filter-field">
    <label for="maxAge">Max Age (s)</label>
    <input type="number" id="maxAge" step="any" placeholder="none" />
  </div>
  <div class="filter-field">
    <label for="minTargetBuy">Min Target Buy (SOL)</label>
    <input type="number" id="minTargetBuy" step="any" placeholder="none" />
  </div>
  <div class="filter-field">
    <label for="maxTargetBuy">Max Target Buy (SOL)</label>
    <input type="number" id="maxTargetBuy" step="any" placeholder="none" />
  </div>
  <button class="save-btn" id="saveFilters">Save Filters</button>
  <span id="filtersStatus"></span>
</div>

<main>
  <section class="positions-section">
    <h2>Open Positions</h2>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Mint</th><th>Venue</th><th>Entry Mcap</th><th>Current Mcap</th><th>Unrealized PnL</th><th>Qty</th><th>Entry SOL</th><th>Age</th><th></th><th></th>
          </tr>
        </thead>
        <tbody id="positionsBody"></tbody>
      </table>
    </div>
    <div class="empty" id="positionsEmpty" style="display:none">No open positions</div>
  </section>

  <div class="side-grid">
    <section>
      <h2>Copy Log</h2>
      <div id="copyLog"></div>
      <div class="empty" id="copyLogEmpty">No copies yet</div>
    </section>

    <section>
      <h2>Live Feed</h2>
      <div id="feed"></div>
    </section>
  </div>
</main>

<script>
const API_BASE = window.location.origin;
const WS_URL = API_BASE.replace(/^http/, "ws") + "/ws";

let state = { balanceSol: 0, positions: [], trades: [], startingBalanceSol: 0, mode: "paper", solUsdPrice: null, symbols: {} };
const pnlByPosition = {}; // positionId -> { currentPrice, unrealizedPnlSol, unrealizedPnlPct }

function shorten(addr) { return addr ? addr.slice(0, 6) + "…" + addr.slice(-4) : ""; }
function mintLabel(mint) {
  const symbol = state.symbols && state.symbols[mint];
  return symbol ? `${shorten(mint)} (${symbol})` : shorten(mint);
}
function fmtUsdCompact(usd) {
  if (usd >= 1_000_000) return "$" + (usd / 1_000_000).toFixed(2) + "M";
  if (usd >= 1_000) return "$" + (usd / 1_000).toFixed(1) + "K";
  return "$" + usd.toFixed(0);
}
function fmtMcap(sol, usd) {
  if (sol === null || sol === undefined) return "—";
  const solStr = (sol >= 1 ? sol.toFixed(2) : sol.toFixed(4)) + " SOL";
  return usd !== null && usd !== undefined ? `${solStr} (${fmtUsdCompact(usd)})` : solStr;
}
function fmtSigned(n, decimals) { return (n >= 0 ? "+" : "") + n.toFixed(decimals); }
function ageStr(openedAt) {
  const s = Math.floor(Date.now() / 1000 - openedAt);
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m";
  return Math.floor(s / 3600) + "h";
}

function render() {
  if (state.botName) {
    document.title = state.botName;
    document.getElementById("botName").textContent = state.botName;
  }
  document.getElementById("mode").textContent = state.mode;
  document.getElementById("balance").textContent = state.balanceSol.toFixed(4) + " SOL";

  const openPositions = state.positions.filter((p) => p.status === "open");
  document.getElementById("openCount").textContent = openPositions.length;

  const totalPnl = state.positions.reduce((sum, p) => sum + (p.realizedPnlSol || 0), 0);
  const pnlEl = document.getElementById("pnl");
  pnlEl.textContent = (totalPnl >= 0 ? "+" : "") + totalPnl.toFixed(4) + " SOL";
  pnlEl.className = "value " + (totalPnl >= 0 ? "pos" : "neg");

  const body = document.getElementById("positionsBody");
  const empty = document.getElementById("positionsEmpty");
  body.innerHTML = "";
  empty.style.display = openPositions.length === 0 ? "block" : "none";

  for (const p of openPositions) {
    const pnl = pnlByPosition[p.id];
    const entryMcapStr = p.entryMcapSol !== undefined ? fmtMcap(p.entryMcapSol, p.entryMcapUsd) : "—";
    const currentMcapStr = pnl && pnl.currentMcapSol !== null && pnl.currentMcapSol !== undefined ? fmtMcap(pnl.currentMcapSol, pnl.currentMcapUsd) : "—";
    const pnlUsd = pnl && pnl.unrealizedPnlUsd !== null && pnl.unrealizedPnlUsd !== undefined
      ? ` (${fmtSigned(pnl.unrealizedPnlUsd, 2)}$)`
      : "";
    const pnlStr = pnl
      ? `<span class="${pnl.unrealizedPnlSol >= 0 ? "pos" : "neg"}">${fmtSigned(pnl.unrealizedPnlSol, 4)} SOL${pnlUsd} (${fmtSigned(pnl.unrealizedPnlPct, 1)}%)</span>`
      : "—";
    const tr = document.createElement("tr");
    if (p.held) tr.className = "held-row";
    tr.innerHTML = `
      <td class="mint-cell">
        <a class="mint-link" href="https://solscan.io/token/${p.mint}" target="_blank" rel="noopener">${mintLabel(p.mint)}</a>
        <button class="copy-btn" data-mint="${p.mint}" title="Copy contract address">📋</button>
        ${p.held ? `<span class="held-badge" title="All automatic exits suspended (TP/SL/trailing-stop/copy-sell) — only manual Close works">🌕 HOLD</span>` : ""}
      </td>
      <td>${p.venue}</td>
      <td>${entryMcapStr}</td>
      <td>${currentMcapStr}</td>
      <td>${pnlStr}</td>
      <td>${Math.round(p.remainingTokenAmount).toLocaleString()}</td>
      <td>${p.entrySolAmount.toFixed(4)}</td>
      <td>${ageStr(p.openedAt)}</td>
      <td><button class="hold-btn ${p.held ? "active" : ""}" data-id="${p.id}" data-held="${p.held ? "1" : "0"}" title="Suspend all automatic exits (TP/SL/trailing-stop/copy-sell) — only manual Close will work">${p.held ? "🌕 Held" : "Hold"}</button></td>
      <td><button class="close-btn" data-id="${p.id}">Close</button></td>
    `;
    body.appendChild(tr);
  }

  for (const btn of body.querySelectorAll(".close-btn")) {
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      btn.textContent = "Closing…";
      try {
        const res = await fetch(`${API_BASE}/api/positions/${btn.dataset.id}/close`, { method: "POST" });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          addFeedItem("status", `Close failed: ${err.error || res.status}`);
          btn.disabled = false;
          btn.textContent = "Close";
        }
        // success updates arrive via the WS "sell" broadcast
      } catch (e) {
        addFeedItem("status", `Close failed: ${e}`);
        btn.disabled = false;
        btn.textContent = "Close";
      }
    });
  }

  for (const btn of body.querySelectorAll(".hold-btn")) {
    btn.addEventListener("click", async () => {
      const nextHeld = btn.dataset.held !== "1";
      btn.disabled = true;
      try {
        const res = await fetch(`${API_BASE}/api/positions/${btn.dataset.id}/hold`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ held: nextHeld }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          addFeedItem("status", `Hold toggle failed: ${err.error || res.status}`);
        }
        // success updates arrive via the WS "buy" broadcast (re-upserts the position)
      } catch (e) {
        addFeedItem("status", `Hold toggle failed: ${e}`);
      }
      btn.disabled = false;
    });
  }

  attachCopyHandlers(body);
}

// Shared by the positions table and the copy log — call after inserting any .copy-btn into the DOM.
function attachCopyHandlers(root) {
  for (const btn of root.querySelectorAll(".copy-btn")) {
    if (btn.dataset.copyBound) continue;
    btn.dataset.copyBound = "1";
    btn.addEventListener("click", async () => {
      const mint = btn.dataset.mint;
      try {
        await navigator.clipboard.writeText(mint);
      } catch {
        // clipboard API unavailable (e.g. insecure context) — fall back to a hidden textarea
        const ta = document.createElement("textarea");
        ta.value = mint;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
      const original = btn.textContent;
      btn.textContent = "✅";
      setTimeout(() => { btn.textContent = original; }, 1200);
    });
  }
}

function addFeedItem(kind, text) {
  const feed = document.getElementById("feed");
  const div = document.createElement("div");
  div.className = "feed-item " + kind;
  const time = new Date().toLocaleTimeString();
  div.innerHTML = `<span class="time">${time}</span>${text}`;
  feed.prepend(div);
  while (feed.children.length > 200) feed.removeChild(feed.lastChild);
}

function addCopyLogEntry(c) {
  const log = document.getElementById("copyLog");
  document.getElementById("copyLogEmpty").style.display = "none";

  let deltaHtml = "";
  if (c.targetMcapSol !== null && c.botMcapSol !== null && c.targetMcapSol > 0) {
    const deltaPct = ((c.botMcapSol - c.targetMcapSol) / c.targetMcapSol) * 100;
    deltaHtml = `<span class="delta ${deltaPct >= 0 ? "neg" : "pos"}">${fmtSigned(deltaPct, 1)}% vs target</span>`;
  }

  const div = document.createElement("div");
  div.className = "copy-entry";
  div.innerHTML = `
    <div class="row">
      <span class="mint-cell">
        <a class="mint-link" href="https://solscan.io/token/${c.mint}" target="_blank" rel="noopener">${mintLabel(c.mint)}</a>
        <button class="copy-btn" data-mint="${c.mint}" title="Copy contract address">📋</button>
        — ${c.direction.toUpperCase()}
      </span>
      <span class="time">${new Date(c.timestamp * 1000).toLocaleTimeString()}</span>
    </div>
    <div class="row"><span class="label">Target (${shorten(c.targetWallet)})</span><span>${c.targetSolAmount.toFixed(4)} SOL @ mcap ${fmtMcap(c.targetMcapSol, c.targetMcapUsd)}</span></div>
    <div class="row"><span class="label">Bot copied</span><span>${c.botSolAmount.toFixed(4)} SOL @ mcap ${fmtMcap(c.botMcapSol, c.botMcapUsd)} ${deltaHtml}</span></div>
  `;
  log.prepend(div);
  attachCopyHandlers(div);
  while (log.children.length > 100) log.removeChild(log.lastChild);
}

function applySettingsToInputs(s) {
  document.getElementById("minMcap").value = s.minMcapUsd ?? "";
  document.getElementById("maxMcap").value = s.maxMcapUsd ?? "";
  document.getElementById("minAge").value = s.minAgeSeconds ?? "";
  document.getElementById("maxAge").value = s.maxAgeSeconds ?? "";
  document.getElementById("minTargetBuy").value = s.minTargetBuySol ?? "";
  document.getElementById("maxTargetBuy").value = s.maxTargetBuySol ?? "";
}

async function loadSettings() {
  const res = await fetch(`${API_BASE}/api/settings`);
  applySettingsToInputs(await res.json());
}

function readFilterInput(id) {
  const raw = document.getElementById(id).value.trim();
  return raw === "" ? null : Number(raw);
}

document.getElementById("saveFilters").addEventListener("click", async () => {
  const statusEl = document.getElementById("filtersStatus");
  const patch = {
    minMcapUsd: readFilterInput("minMcap"),
    maxMcapUsd: readFilterInput("maxMcap"),
    minAgeSeconds: readFilterInput("minAge"),
    maxAgeSeconds: readFilterInput("maxAge"),
    minTargetBuySol: readFilterInput("minTargetBuy"),
    maxTargetBuySol: readFilterInput("maxTargetBuy"),
  };
  try {
    const res = await fetch(`${API_BASE}/api/settings`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(patch),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.status);
    statusEl.textContent = "Saved ✓";
    statusEl.className = "";
  } catch (e) {
    statusEl.textContent = "Failed: " + e.message;
  }
  setTimeout(() => { statusEl.textContent = ""; }, 3000);
});

async function loadState() {
  const res = await fetch(`${API_BASE}/api/state`);
  state = await res.json();
  render();
}

function connectWs() {
  const ws = new WebSocket(WS_URL);
  const badge = document.getElementById("wsStatus");

  ws.onopen = () => { badge.textContent = "live"; badge.className = "badge connected"; };
  ws.onclose = () => {
    badge.textContent = "reconnecting…";
    badge.className = "badge disconnected";
    setTimeout(connectWs, 2000);
  };
  ws.onerror = () => ws.close();

  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    switch (msg.type) {
      case "state":
        state = msg.payload;
        render();
        break;
      case "status":
        addFeedItem("status", `[${msg.payload.source}] ${msg.payload.status}${msg.payload.detail ? " — " + msg.payload.detail : ""}`);
        break;
      case "trade":
        addFeedItem("status", `[${msg.payload.venue}] ${msg.payload.direction.toUpperCase()} ${mintLabel(msg.payload.mint)} by ${shorten(msg.payload.trader)} — ${msg.payload.solAmount.toFixed(4)} SOL`);
        break;
      case "buy":
        state.positions = state.positions.filter((p) => p.id !== msg.payload.id).concat(msg.payload);
        addFeedItem("buy", `BUY ${mintLabel(msg.payload.mint)} @ ${msg.payload.entryPrice.toExponential(3)} — ${msg.payload.entrySolAmount.toFixed(4)} SOL`);
        loadState();
        break;
      case "sell":
        addFeedItem("sell", `SELL ${mintLabel(msg.payload.position.mint)} (${msg.payload.reason}) — ${msg.payload.entry.solAmount.toFixed(4)} SOL`);
        loadState();
        break;
      case "create":
        (state.symbols ??= {})[msg.payload.mint] = msg.payload.symbol;
        addFeedItem("status", `NEW LAUNCH ${msg.payload.symbol} "${msg.payload.name}" ${shorten(msg.payload.mint)}`);
        break;
      case "migration":
        addFeedItem("status", `MIGRATED ${mintLabel(msg.payload.mint)} → PumpSwap`);
        break;
      case "copy":
        addCopyLogEntry(msg.payload);
        break;
      case "symbol":
        (state.symbols ??= {})[msg.payload.mint] = msg.payload.symbol;
        render();
        break;
      case "priceUpdate":
        pnlByPosition[msg.payload.positionId] = msg.payload;
        render();
        break;
      case "settings":
        applySettingsToInputs(msg.payload);
        break;
    }
  };
}

loadState();
loadSettings();
connectWs();
setInterval(() => { if (state.positions.some((p) => p.status === "open")) render(); }, 5000); // refresh age counters
</script>
</body>
</html>
